# ============================================
# 潜能星图 - Docker Compose 部署
# ============================================

version: '3.8'

services:
  # ---- Node.js 应用 ----
  app:
    build: .
    container_name: kiroo-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LZU_MODE=${LZU_MODE:-true}
      - SMS_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - app_data:/app/data
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

volumes:
  app_data:
